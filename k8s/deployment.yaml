apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumina
  labels:
    app: lumina
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lumina
  template:
    metadata:
      labels:
        app: lumina
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: lumina
          image: ghcr.io/skit-devops-2026/devops-24eskcs067:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
